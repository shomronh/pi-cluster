apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1m0s
  # dependsOn:
  #   - name: infra-configs
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/staging
  
  # prune: true will remove any resources that are no longer defined 
  # in the source, which helps to keep the cluster clean and up-to-date 
  # with the desired state defined in the Git repository. 
  prune: true
  
  decryption:
    provider: sops
    secretRef:
      name: sops-age